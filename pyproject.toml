[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mafinrisk-portfolio-optimizer"
version = "1.0.0"
description = "Reproducible constrained mean-variance portfolio research in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
mafinrisk = "mafinrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
